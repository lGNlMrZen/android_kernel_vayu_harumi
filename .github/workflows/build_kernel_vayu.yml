name: Build Kernel Vayu (Poco X3 Pro)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch kernel source"
        default: "16"
      defconfig:
        description: "Defconfig (nama file di arch/arm64/configs)"
        default: "vayu_defconfig"

env:
  KERNEL_REPO: https://github.com/lGNlMrZen/android_kernel_vayu_harumi
  ARCH: arm64
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r416183b.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential \
            ccache zip git curl lld python3 cpio dwarves device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ inputs.branch }}" "$KERNEL_REPO" kernel

      - name: Setup clang
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            -b master-kernel-build-2021 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            $HOME/clang-src
          cd $HOME/clang-src
          git sparse-checkout set clang-r416183b
          echo "$HOME/clang-src/clang-r416183b/bin" >> $GITHUB_PATH
          $HOME/clang-src/clang-r416183b/bin/clang --version | head -1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-vayu-${{ github.run_id }}
          restore-keys: ccache-vayu-

      - name: Configure
        working-directory: kernel
        run: |
          if [ ! -f "arch/arm64/configs/${{ inputs.defconfig }}" ]; then
            echo "Defconfig tidak ditemukan. Daftar yang mirip:"
            ls arch/arm64/configs | grep -i -E "vayu|sm8150|bhima" || ls arch/arm64/configs | head -50
            exit 1
          fi
          make O=out ARCH=$ARCH \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            "${{ inputs.defconfig }}"

      - name: Build
        working-directory: kernel
        run: |
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 5G
          make -j$(nproc) O=out ARCH=$ARCH \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb 2>&1 | tee ../build.log
          ls -lh out/arch/arm64/boot/

      - name: Build dtbo (opsional)
        working-directory: kernel
        continue-on-error: true
        run: |
          make -j$(nproc) O=out ARCH=$ARCH \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            dtbo.img
          ls -lh out/arch/arm64/boot/dtbo.img

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AK3/
          cp kernel/out/arch/arm64/boot/dtbo.img AK3/ 2>/dev/null || true
          cd AK3
          sed -i 's/^kernel.string=.*/kernel.string=Vayu Kernel by lGNlMrZen/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=vayu/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=bhima/' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=auto/' anykernel.sh
          rm -rf .git README.md
          zip -r9 ../Vayu-Kernel-$(date +%Y%m%d).zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vayu-kernel
          path: |
            Vayu-Kernel-*.zip
            build.log
